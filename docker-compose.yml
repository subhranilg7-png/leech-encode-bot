services:
  bot:
    build: .
    environment:
      - BOT_TOKEN
      - API_ID
      - API_HASH
      - OWNER_ID
      - ARIA2_RPC_SECRET
      - DB_PATH=/app/data/bot.db
    restart: unless-stopped
    volumes:
      - downloads:/app/downloads
      - encoded:/app/encoded
      - thumbnails:/app/thumbnails
      - data:/app/data

volumes:
  downloads:
  encoded:
  thumbnails:
  data:
